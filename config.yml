project:
    name: VDA
    description: Downscaling
    authors:
        - Fiddes J.
        - Filhol S.
        - Aalstad K.
    date: Jan 2022
    directory:
    start: 2017-10-01
    end: 2018-09-30
    split:
        IO: False
        time: 1  # run indivudal batch in time
        space: None  # to be implemented
    extent: # [N, S, W, E]
    CPU_cores: 12

    climate: era5

climate:
    era5:
        path: inputs/climate/
        product: reanalysis
        timestep: 1H
        plevels: [500, 600, 700, 850, 1000]
        download_threads: 10
        realtime: False
        output_format: netcdf
        data_repository: cds

    precip_lapse_rate: False

dem:
    path: inputs/dem/
    file :  VDA_PADDED_utm.tif
    epsg: 32632
    horizon_increments: 10
    dem_resol: 200

sampling:
    method: toposub
    points:
        csv_file:

    toposub:
        clustering_method: minibatchkmean
        n_clusters: 1500
        random_seed: 2
        clustering_features: {'x':1, 'y':1, 'elevation':1, 'slope':1, 'aspect_cos':1, 'aspect_sin':1, 'svf':1}

toposcale:
    interpolation_method: idw
    pt_sampling_method: nearest
    LW_terrain_contribution: True

outputs:
    directory:
    variables: all  # list or combination name
    file:
        clean_outputs: True
        clean_FSM: True
        df_centroids: df_centroids.pck
        ds_param: ds_param.nc
        ds_solar: ds_solar.nc
        da_horizon: da_horizon.nc
        landform: landform.tif
        downscaled_pt: down_pt_*.nc
clean_up:
    delete_tmp_dirs: True